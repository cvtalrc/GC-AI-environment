user nginx;
events {}
http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    limit_conn_zone $server_name zone=api_connections:10m;
    server {
        server_name _;
        client_body_timeout 30s;
        listen 80;
        root /usr/share/nginx/html;
        client_max_body_size 12m;
        location /api/ {
            error_page 413 = @api_too_large;
            error_page 502 504 = @api_unavailable;
            error_page 503 = @api_busy;
            limit_conn api_connections 4;
            limit_conn_status 503;
            proxy_pass http://backend:5001/;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization '';
        }
        location @api_too_large {
            default_type application/json;
            return 413 '{"status_code":413,"error":"Request is too large","code":"request_too_large"}';
        }
        location @api_unavailable {
            default_type application/json;
            return 503 '{"status_code":503,"error":"Service is unavailable","code":"dependency_unavailable"}';
        }
        location @api_busy {
            default_type application/json;
            add_header Retry-After 1 always;
            return 503 '{"status_code":503,"error":"Service is busy","code":"inference_busy"}';
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
